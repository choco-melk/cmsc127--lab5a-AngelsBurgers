<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='stylesheet.css'>
    <link rel="icon" type="image/x-icon" href="images/dota2-logo.ico">
    <title>DOTA 2 Heroes</title>
</head>
<body>
    <div id='body-overlay'></div>
    <header>
        <div id="header-overlay"></div>
        <a href="https://www.dota2.com/home">
        <div id="logo-container">
            <img src='images/dota2-logo.png'>
            <h2>DOTA 2</h2>
        </div>
        </a>
        <form>
            <input id='search-bar' type='text' placeholder='Search Hero'>
        </form>        
    </header>
    <h1 id='section-label'>CHOOSE YOUR HERO</h1>
    <div id='choose-hero-section'>
        <aside id='filter-navigation'>
            <div class='filter-option selected' id='all-filter'>
                <img src='images/all-logo.png'>
                <h3>All</h3>
            </div>
            <div class='filter-option' id='strength-filter'>
                <img src='images/strength-logo.png'>
                <h3>Strength</h3>
            </div>
            <div class='filter-option' id='agility-filter'>
                <img src='images/agility-logo.png'>
                <h3>Agility</h3>
            </div>
            <div class='filter-option' id='intelligence-filter'>
                <img src='images/intelligence-logo.png'>
                <h3>Intelligence</h3>
            </div>
            <div class='filter-option' id='universal-filter'>
                <img src='images/universal-logo.png'>
                <h3>Universal</h3>
            </div>
        </aside>
        <audio src="./hover.mp3" class="enter"  preload="metadata" allow="autoplay"></audio>
        <section id="hero-selection-container">
            <section id='hero-gallery'>
            </section>
        </section>
        <aside id="hero-selected">
            <img src='images/exit.png' id='close-button'>
            <img id="hero-image">
            <h2 id='hero-name'></h2>
            <div id='primary-attr'>
                <img id="primary-attr-image">
                <h3 id='hero-primary-attr'></h3>
            </div>
            <br>
            <h4 id='attack-type-text'>Attack Type</h4>
            <div id='attack-type'>
                <img id="attack-type-image">
                <h4 id='hero-attack-type'></h4>
            </div>
            <br>
            <h4 id='roles-text'>Roles</h4>
            <div id='hero-roles'>
        </aside>
    </div>
</body>
<script src='scripts.js'></script>
</html>
